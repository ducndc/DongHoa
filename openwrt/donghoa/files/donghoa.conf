# DongHoa configuration for OpenWrt. Full option list: donghoa.conf.example in
# the source tree. Restart after editing: service donghoa restart

name OpenWrt
# Must be unique per AP. Defaults to the MAC of the first 'iface'.
#ap_id 02:00:00:00:00:01

# The bridge that joins the wired uplink and any Wi-Fi backhaul.
iface br-lan

# Security is off by default. Recommended: the same secret on every AP, e.g.
#   echo hex:$(head -c 32 /dev/urandom | hexdump -ve '1/1 "%.2x"')
# (the example value below is public and refused if left as it is), and the
# liveness check against replayed messages.
#key change-me-to-a-long-random-secret
#liveness_check 1

# Recommended: per-AP signatures. Run "donghoa -g" on each AP, keep its
# sign_seed line here, and list every AP's peer_key line on every AP
# (ap_id = the MAC "DongHoa ... ap_id" logs at start-up). Both or neither.
#sign_seed hex:<64 hex digits>
#peer_key <ap_id> hex:<64 hex digits>
# Or automatic enrollment: keys in /etc/donghoa.seed and /etc/donghoa.trust
# (kept across sysupgrade); admit a new AP with
#   donghoa_cli /var/run/donghoa.sock ENROLL approve <ap_id>
#enroll 1


# Managed BSSes. With no "bss" line here, the init script adds one for every
# AP interface of /etc/config/wireless that is up, using its runtime name
# (phy<N>-ap<M> unless option ifname is set), its mobility_domain and its
# maxassoc (see the result in /var/run/donghoa.conf). Changes made through
# uci/LuCI restart the service. On each AP wifi-iface set: ieee80211k '1',
# bss_transition '1', ieee80211r '1' and the same mobility_domain everywhere.
# To choose BSSes by hand instead, list them:
#bss phy0-ap0 mdid=a1b2 max_sta=64
#bss phy1-ap0 mdid=a1b2 max_sta=64

hostapd_ctrl_dir /var/run/hostapd
ctrl_socket /var/run/donghoa.sock
