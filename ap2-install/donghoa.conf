# DongHoa configuration for the second AP. Observe-only to start: no
# steering policy is enabled, so it will attach to hostapd, discover the
# other AP as an ARCP peer, and be queryable via donghoa_cli, but will not
# move or disconnect any client. Enable rssi_steering / band_steering /
# load_balancing yourself once you've confirmed it's talking to the first
# AP (donghoa_cli /var/run/donghoa.sock PEERS should list it).

name ap2
# Give this AP a unique name if you run more than two.

iface br-lan

# MUST match the first AP's key exactly (same hex: value from its
# /etc/donghoa.conf) or the two will never authenticate each other's ARCP
# messages and PEERS will stay empty. Copy it from the first AP, do not
# invent a new one here.
key hex:2057acc90a3184817443ecb87cba89317f4b3d6a17f31d40c04300ff318472ab

hostapd_ctrl_dir /var/run/hostapd
ctrl_socket /var/run/donghoa.sock

rssi_steering 0
band_steering 0
load_balancing 0
